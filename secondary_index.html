<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control Limits</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0;padding:24px;background:#f4f6fb;color:#1b1b1b}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:#666;margin:0 0 20px;font-size:13px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
  .card{background:#fff;border:1px solid #e0e0e0;border-radius:10px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .card h2{margin:0 0 2px;font-size:16px}
  .tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;margin-left:8px;vertical-align:middle}
  .t-abs{background:#ffecec;color:#c42}
  .t-time{background:#e6f0fc;color:#269}
  .doms{color:#444;font-size:13px;margin:8px 0;word-break:break-word}
  .state{font-weight:600}
  .st-blocked{color:#c42}
  .st-free{color:#2a8}
  .count{font-family:mono;font-size:20px;margin:6px 0}
  .lim{color:#777;font-size:12px}
  .banner{border-radius:10px;padding:12px 16px;margin:0 0 18px;font-size:14px}
  .b-red{background:#f7d9d9;color:#900}
  .b-amber{background:#fbf0d9;color:#8a0}
  .b-green{background:#e9f5e9;color:#064}
  .b-gray{background:#e7e7e7;color:#555}
  .topnav{max-width:540px;margin:0 0 18px;padding:6px;background:#fff;
         border:1px solid #e0e0e0;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.05);
         display:flex;gap:16px}
  .topnav a{padding:8px 16px;border-radius:6px;text-decoration:none;font-weight:600;color:#445;background:transparent}
  .topnav a:hover{background:#eef1f5}
  .topnav a.active{background:#2b6289;color:#fff}
  .why{font-weight:500}
  .statline{color:#666;font-size:12px;margin-top:16px}
</style>
</head>
<body>
  <nav class="topnav"><a href="/">Status</a><a href="/workout.html">Workout</a><a href="/work.html">Work</a></nav>
<h1>Control Limits</h1>
<p class="sub">You are on a controlled device. Limits come from the central server
   (<span id="central"></span>). Restricted sites resolve to 0.0.0.0.</p>
<div id="bypbanner" class="banner hidden"></div>
<div class="grid" id="limits"></div>
<div class="statline" id="stats">loading…</div>

<script>
const $ = s => document.querySelector(s);

async function load(){
  const r = await fetch("/api/limits");
  const limits = await r.json();
  const el = $("#limits"); el.innerHTML="";
  const now = Date.now();
  if(!limits.length){ el.innerHTML = "<p class=lim>No limits loaded from central yet — check connectivity.</p>"; }
  limits.forEach(l => el.appendChild(render(l, now)));
}
function fmt(ms){ ms=Math.max(0,Math.round(ms/1000)); const h=String(Math.floor(ms/3600)).padStart(2,"0");
  const m=String(Math.floor((ms%3600)/60)).padStart(2,"0"); const s=String(ms%60).padStart(2,"0"); return h+":"+m+":"+s; }
function render(l, now){
  const card=document.createElement("div"); card.className="card";
  const tag = l.type==="absolute" ? '<span class="tag t-abs">ABSOLUTE</span>' : '<span class="tag t-time">TIME</span>';
  let body="";
  if(l.type==="absolute"){ body=`<div class="state st-blocked">Always blocked</div>`; }
  else if(l.state==="free"){
    if(l.grace_until!=null){ body=`<div class="state st-free">Freedom → blocked in</div><div class="count">${fmt(l.grace_until-now)}</div>`; }
    else { body=`<div class="state st-free">Free — access allowed</div>`; }
  } else {
    if(l.cooldown_until!=null){ body=`<div class="state st-blocked">Blocked → free in</div><div class="count">${fmt(l.cooldown_until-now)}</div>`; }
    else { body=`<div class="state st-blocked">Blocked</div>`; }
  }
  card.innerHTML=`<h2>${l.name||"(untitled)"} ${tag}</h2>
    <div class="doms">${(l.domains||[]).join(", ")}</div>${body}
    <div class="lim">${l.type} · grace ${l.grace_ms?Math.round(l.grace_ms/60000)+"m":"—"} · cooldown ${l.cooldown_ms?Math.round(l.cooldown_ms/60000)+"m":"—"}</div>`;
  return card;
}

async function loadBypass(){
  let d;
  try { d = await (await fetch("/api/remote/status")).json(); } catch(e){ return; }
  $("#central").textContent = d.central || "?";
  let el=$("#bypbanner");
  el.classList.remove("hidden","b-red","b-amber","b-green","b-gray");
  if(d.effective_nuclear){
    el.classList.add("b-red");
    el.innerHTML="⛔ ALL BLOCKED <span class=why>["+ (d.reason||"bypass detected") +"]</span>";
  } else if(d.emergency){
    el.classList.add("b-amber");
    el.innerHTML="⚠ OFFLINE — connected to central is down; restricted sites stay blocked until you reconnect <span class=why>(last sync "+fmt(Date.now()-(d.last_sync_ms||0))+")</span>";
  } else if(!d.online){
    el.classList.add("b-amber");
    el.innerHTML="⚠ Reconnecting to central… <span class=why></span>";
  } else {
    el.classList.add("b-green");
    el.innerHTML="✓ In sync with central — "+d.num_limits+" limit(s) enforced";
  }
  try {
    const s = await (await fetch("/api/stats")).json();
    $("#stats").textContent =
      `status: ${s.emergency?"OFFLINE/EMERGENCY":(s.online?"ONLINE":"syncing")} · `+
      `limits: ${d.num_limits} · `+
      `plain-DNS ${s.udp[0]}q/${s.udp[1]}b · DoH ${s.doh[0]}q/${s.doh[1]}b`;
  } catch(e){}
}

load(); loadBypass();
setInterval(load, 2000);
setInterval(loadBypass, 2000);
</script>
</body>
</html>
